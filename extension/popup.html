<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body{width:320px;margin:0;padding:16px 18px;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#161823}
  h1{font-size:16px;margin:0 0 14px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0;gap:12px}
  .row:last-child{border-bottom:none}
  .row label{flex:1;cursor:pointer}
  .row .hint{display:block;font-size:12px;color:#8a8f99}
  select{padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:13px}
  .switch{position:relative;width:40px;height:22px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#ccc;border-radius:22px;transition:.15s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
  input:checked+.slider{background:#fe2c55}
  input:checked+.slider:before{transform:translateX(18px)}
  .foot{margin-top:12px;font-size:12px;color:#8a8f99}
</style>
</head>
<body>
  <h1 data-i18n="settingsTitle"></h1>

  <div class="row">
    <label for="quickBlock" data-i18n="quickBlock"></label>
    <span class="switch"><input type="checkbox" id="quickBlock"><span class="slider"></span></span>
  </div>

  <div class="row">
    <label for="stripEmojiSpaces"><span data-i18n="stripEmojiSpaces"></span><span class="hint" data-i18n="stripEmojiSpacesHint"></span></label>
    <span class="switch"><input type="checkbox" id="stripEmojiSpaces"><span class="slider"></span></span>
  </div>

  <div class="row">
    <label for="applyDefaults"><span data-i18n="applyDefaults"></span><span class="hint" data-i18n="applyDefaultsHint"></span></label>
    <span class="switch"><input type="checkbox" id="applyDefaults"><span class="slider"></span></span>
  </div>

  <div class="row">
    <label for="defaultResolution" data-i18n="defaultResolution"></label>
    <select id="defaultResolution">
      <option value="自动" data-i18n="resAuto"></option>
      <option value="高清 1080P" data-i18n="res1080"></option>
      <option value="高清 720P" data-i18n="res720"></option>
      <option value="标清 540P" data-i18n="res540"></option>
      <option value="极速" data-i18n="resFast"></option>
    </select>
  </div>

  <div class="row">
    <label for="defaultSpeed" data-i18n="defaultSpeed"></label>
    <select id="defaultSpeed">
      <option value="0" data-i18n="speedOff"></option>
      <option value="0.75">0.75x</option>
      <option value="1">1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="1.75">1.75x</option>
      <option value="2">2.0x</option>
      <option value="3">3.0x</option>
    </select>
  </div>

  <div class="foot" data-i18n="footNote"></div>

<script src="popup.js"></script>
</body>
</html>
